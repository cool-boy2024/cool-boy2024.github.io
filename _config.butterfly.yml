aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 持续记录建站、AI、开发工具与踩坑复盘
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/cool-boy2024
  card_announcement:
    enable: true
    content: 这里优先更新可复现的教程、排障步骤和实战记录
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 40
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: false

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

toc:
  post: true
  page: false
  number: true
  expand: false
  scroll_percent: true

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true

wordcount:
  enable: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

comments:
  use:
    - Giscus

giscus:
  repo: cool-boy2024/cool-boy2024.github.io
  repo_id: R_kgDOSUGK5w
  category_id: DIC_kwDOSUGK584C8U6R
  light_theme: light
  dark_theme: dark
  option:
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top
    data-lang: zh-CN

inject:
