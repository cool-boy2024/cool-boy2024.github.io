  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/cool-boy2024 || GitHub || '#24292e'

avatar:
  img: /img/avatar.jpg
  effect: true

index_img: /img/home-cover.png

default_top_img: /img/home-cover.png

subtitle:
  enable: true
  effect: true
  source: false
